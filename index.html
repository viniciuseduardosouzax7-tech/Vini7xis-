<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Neon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="panel-container">
    <h1 class="panel-title">PAINEL CONTROL</h1>

    <div class="options-group">
      <div class="option-card">
        <span class="option-label">Aimbot</span>
        <label class="switch">
          <input type="checkbox" id="aimbot-toggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="option-card">
        <span class="option-label">Aim FOV</span>
        <input type="range" id="aimfov-slider" min="1" max="180" value="90" class="range-input">
        <span id="fov-value" class="value-display">90°</span>
      </div>

      <div class="option-card">
        <span class="option-label">No Recoil</span>
        <label class="switch">
          <input type="checkbox" id="recoil-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
